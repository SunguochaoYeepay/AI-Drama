[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-drama"
version = "0.1.0"
description = "Generate multi-character drama audio, Qwen keyframes, and MiniMax H3 video shots"
requires-python = ">=3.11"

[project.scripts]
ai-drama = "ai_drama.cli:main"

[tool.setuptools.packages.find]
include = ["ai_drama*"]
